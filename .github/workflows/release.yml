name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # a release must not ship code that fails the PR checks
      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.event.release.tag_name }}

      - name: Create release archive
        run: |
          cd dist
          zip -r ../imlate-ui-${{ github.event.release.tag_name }}.zip admin/

      - name: Upload archive to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: imlate-ui-${{ github.event.release.tag_name }}.zip
