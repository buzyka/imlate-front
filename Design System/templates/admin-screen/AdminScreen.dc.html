<x-dc>

<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.DataTable" columns="{{ columns }}" data="{{ rows }}" empty="No data found" hint-size="100%,240px"></x-import>

<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.Avatar" size="{{ 120 }}" style="margin-bottom:8px" hint-size="120px,120px"></x-import>

</x-import>
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.FormField" label="Surname" required="{{ true }}" hint-size="100%,50px">
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.Input" icon-base="../../assets/icons" hint-size="100%,32px"></x-import>
</x-import>
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.FormField" label="Is Student" hint-size="100%,50px">
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.Switch" hint-size="40px,20px"></x-import>
</x-import>
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.FormActions" hint-size="100%,32px">
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.Button" type="primary" hint-size="80px,32px">Create</x-import>
<x-import component-from-global-scope="ImLateDesignSystem_9c9b6f.Button" hint-size="70px,32px">Reset</x-import>
</x-import>
</x-import>

</div>
</main>
</div>
