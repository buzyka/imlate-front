<!-- @dsCard group="Admin panel" viewport="1280x860" name="Reports workspace" subtitle="Multi-report workspace: Fire List / Attendance Report switcher, filter panel, applied-filter chips, export toolbar" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImLate — Reports workspace</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--il-font-sans);font-size:var(--el-font-size-base);color:var(--el-text-color-primary);background:var(--il-surface-page)}
a{color:var(--el-color-primary);text-decoration:none}a:hover{color:var(--el-color-primary-light-3)}
@keyframes il-spin{to{transform:rotate(360deg)}}
@keyframes il-skeleton{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes il-fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<script type="text/babel" src="./ReportsScreen.jsx"></script>
<script type="text/babel">
const { MessageStack } = window.ImLateDesignSystem_9c9b6f;
function Host() {
  const [messages, setMessages] = React.useState([]);
  const notify = (type, text) => {
    const id = Date.now() + Math.random();
    setMessages(m => [...m, { id, type, text }]);
    setTimeout(() => setMessages(m => m.filter(x => x.id !== id)), 3000);
  };
  return <><ReportsScreen notify={notify} /><MessageStack messages={messages} iconBase="../../assets/icons" /></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Host />);
</script>
</body>
</html>
