<meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;font-family:var(--il-font-sans);background:#fff}.grp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--il-text-mute);width:100%;margin-bottom:-4px}@keyframes il-spin{to{transform:rotate(360deg)}}@keyframes il-skeleton{0%{background-position:100% 50%}100%{background-position:0 50%}}</style>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { DataTable, StatusTag, Pagination, Skeleton, KpiStat, Avatar, Tag, Button, Icon } = window.ImLateDesignSystem_9c9b6f;
const IB = '../../assets/icons';
const ROWS = [
  { id: 12, name: 'Ada', surname: 'Lovelace', is_student: true, grade: 9, sign_status: 'signed_in', updated: '02/09/2026, 08:41' },
  { id: 13, name: 'Grace', surname: 'Hopper', is_student: false, grade: null, sign_status: 'signed_out', updated: '02/09/2026, 07:58' },
  { id: 14, name: 'Alan', surname: 'Turing', is_student: true, grade: 11, sign_status: 'not_signed', updated: '01/09/2026, 16:02' }
];
function Demo() {
  const [page, setPage] = React.useState(2);
  const [cur, setCur] = React.useState(ROWS[0]);
  return (
    <div>
      <div className="lbl">KpiStat</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:16}}>
        <KpiStat label="Signed in" value="128" intent="success" />
        <KpiStat label="Signed out" value="41" intent="warning" />
        <KpiStat label="Not signed" value="17" intent="info" />
      </div>
      <div className="lbl">DataTable — avatars, tags, sortable, row actions, status wash</div>
      <DataTable
        data={ROWS} currentRow={cur} onRowClick={setCur}
        rowClass={r => r.sign_status.replace('_','-')}
        columns={[
          { label: '', width: 56, render: r => <Avatar size={32} /> },
          { label: 'ID', prop: 'id', width: 56 },
          { label: 'Name', prop: 'name', sortable: true },
          { label: 'Surname', prop: 'surname', sortable: true },
          { label: 'Student', width: 82, render: r => r.is_student ? <Tag type="success" size="small">Yes</Tag> : <Tag type="info" size="small">No</Tag> },
          { label: 'Status', width: 118, render: r => <StatusTag status={r.sign_status} /> },
          { label: '', width: 52, align: 'center', render: () => <Button type="primary" circle size="small" icon={<Icon name="location" size={12} base={IB} color="#fff" />} /> },
          { label: '', width: 52, align: 'center', render: () => <Button type="danger" circle size="small" icon={<Icon name="delete" size={12} base={IB} color="#fff" />} /> }
        ]} />
      <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}>
        <Pagination page={page} total={140} pageSize={20} onChange={setPage} iconBase={IB} />
      </div>
      <div className="lbl" style={{marginTop:14}}>Skeleton — first-load table shape</div>
      <Skeleton rows={3} columns={[50,120,120,160,100,120]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
