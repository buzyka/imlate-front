<script type="text/babel">
const { Message, Popover, HelpPanel, SidebarFooterButton, Icon, Button, Tag, Textarea } = window.ImLateDesignSystem_9c9b6f;
const IB = '../../assets/icons';

        <Message type="success" iconBase={IB}>Visitor updated</Message>

        <Message type="warning" iconBase={IB}>RFID already assigned</Message>

          <div style={{padding:'0 16px',display:'grid',gap:10}}>

            <Icon name="warning-filled" size={18} base={IB} color="var(--el-color-warning)" />
            <span>Delete visitor "Ada Lovelace"?</span>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:24}}>
            <Button>Cancel</Button><Button type="primary">Delete</Button>
