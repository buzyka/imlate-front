<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { FeatureCard, PillButton, ActionChoiceCard, AssetSlotCard, HelpPanel, FilterBar, FilterItem, Select, Tag, Icon } = window.ImLateDesignSystem_9c9b6f;
const IB = '../../assets/icons';
function Demo() {
  const [action, setAction] = React.useState('sign_in');
  return (
    <div>
      <div className="lbl">PillButton — brand hero CTAs</div>
      <div className="grp">
        <PillButton variant="brand">Getting Started</PillButton>
        <PillButton variant="alt">Documentation</PillButton>
      </div>
      <div className="lbl">FilterBar</div>
      <div style={{marginBottom:16}}>
        <FilterBar>
          <FilterItem><Select value={true} onChange={()=>{}} clearable placeholder="Visitor type" iconBase={IB}

          <FilterItem><Select value={null} onChange={()=>{}} clearable placeholder="Status" options={[]} iconBase={IB} /></FilterItem>

      </div>
      <div className="lbl">ActionChoiceCard</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12,maxWidth:440,marginBottom:16}}>
        <ActionChoiceCard badge="Sign In" title="Register arrival" intent="success" active={action==='sign_in'} onClick={()=>setAction('sign_in')} />
        <ActionChoiceCard badge="Sign Out" title="Register departure" intent="danger" active={action==='sign_out'} onClick={()=>setAction('sign_out')} />
      </div>
      <div className="lbl">FeatureCard</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:18,marginBottom:16}}>

      </div>
      <div className="lbl">AssetSlotCard · HelpPanel</div>
      <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
        <AssetSlotCard style={{flex:'0 0 300px'}} label="Logo background" help="Large background image shown on the welcome screen."
          previewSrc="../../assets/logo.png" accepted="PNG, JPEG, WEBP" isCustom onUpload={()=>{}} onReset={()=>{}} />

        </div>
      </div>
    </div>
  );

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
