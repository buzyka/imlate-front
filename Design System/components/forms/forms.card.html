<!-- @dsCard group="Components" viewport="700x480" name="Forms" subtitle="Input, Textarea, InputNumber, Select, Switch, FormField, FileUploadRow" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;font-family:var(--il-font-sans);background:#fff}.grp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--il-text-mute);width:100%;margin-bottom:-4px}@keyframes il-spin{to{transform:rotate(360deg)}}@keyframes il-skeleton{0%{background-position:100% 50%}100%{background-position:0 50%}}</style>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Textarea, InputNumber, Select, Switch, FormField, FormActions, FileUploadRow, Button } = window.ImLateDesignSystem_9c9b6f;
const IB = '../../assets/icons';
const GRADES = Array.from({length:6},(_,i)=>({label:'Grade '+(i+1),value:i+1}));
function Demo() {
  const [q, setQ] = React.useState('Ada');
  const [pw, setPw] = React.useState('secret123');
  const [n, setN] = React.useState(7);
  const [type, setType] = React.useState(true);
  const [grades, setGrades] = React.useState([2,5]);
  const [on, setOn] = React.useState(true);
  return (
    <div>
      <div className="lbl">Input — clearable, prefix icon, password, disabled</div>
      <div className="grp">
        <div style={{width:200}}><Input value={q} onChange={setQ} clearable placeholder="Search by name" iconBase={IB} /></div>
        <div style={{width:200}}><Input value="" onChange={()=>{}} prefixIcon="search" placeholder="Search by grade" iconBase={IB} /></div>
        <div style={{width:180}}><Input value={pw} onChange={setPw} showPassword iconBase={IB} /></div>
        <div style={{width:140}}><Input value="Imported" onChange={()=>{}} disabled /></div>
      </div>
      <div className="lbl">Select — single clearable, multi, disabled</div>
      <div className="grp" style={{alignItems:'flex-start'}}>
        <div style={{width:200}}><Select value={type} onChange={setType} clearable placeholder="Visitor type" iconBase={IB}
          options={[{label:'All visitors',value:null},{label:'Students',value:true},{label:'Teachers',value:false}]} /></div>
        <div style={{width:220}}><Select multiple value={grades} onChange={setGrades} placeholder="Select grade(s)" options={GRADES} iconBase={IB} /></div>
        <div style={{width:160}}><Select value={null} onChange={()=>{}} disabled placeholder="Status" options={[]} iconBase={IB} /></div>
      </div>
      <div className="lbl">Number · Switch · Upload</div>
      <div className="grp">
        <div style={{width:150}}><InputNumber value={n} onChange={setN} min={0} iconBase={IB} /></div>
        <Switch checked={on} onChange={setOn} />
        <Switch checked={false} onChange={()=>{}} />
        <Switch checked disabled />
        <FileUploadRow fileName="ada-lovelace.png" onChoose={()=>{}} onUpload={()=>{}} style={{marginBottom:0}} />
      </div>
      <div className="lbl">FormField — left labels, required, error, help</div>
      <div style={{maxWidth:440}}>
        <FormField label="Name" required><Input value="Ada" onChange={()=>{}} /></FormField>
        <FormField label="Surname" required error="Surname is required"><Input value="" onChange={()=>{}} /></FormField>
        <FormField label="Is Student"><Switch checked onChange={()=>{}} /></FormField>
        <FormField label="Reason" labelPosition="top" help="Add a short note so other administrators understand why this visit was recorded manually.">
          <Textarea value="" onChange={()=>{}} rows={2} placeholder="Example: Visitor arrived at reception and forgot to scan." />
        </FormField>
        <FormActions><Button type="primary">Update</Button><Button>Reset</Button></FormActions>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
