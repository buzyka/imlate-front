<script type="text/babel">
const { SidebarMenu, SidebarFooterButton, Topbar, Tabs, PageHeader, SectionTitle, Button, Icon } = window.ImLateDesignSystem_9c9b6f;
const IB = '../../assets/icons';
function Demo() {
  const [active, setActive] = React.useState('/users');
  const [tab, setTab] = React.useState('theme');
  return (
    <div style={{display:'flex',gap:18,alignItems:'stretch',height:370,border:'1px solid var(--el-border-color-light)',borderRadius:8,overflow:'hidden'}}>
      <SidebarMenu logoSrc="../../assets/logo.png" active={active} onSelect={setActive}
        items={[{index:'/users',label:'Visitors'},{index:'/admin-users',label:'Admin Users'},{index:'/reports',label:'Reports'},{index:'/settings',label:'Settings'}]}
        footer={<SidebarFooterButton icon={<Icon name="question-filled" size={16} base={IB} />}>Help</SidebarFooterButton>} />
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <Topbar userName="alex.morgan" />
        <div style={{flex:1,background:'var(--il-surface-page)',padding:16,minWidth:0}}>
          <PageHeader title="Settings" description="Manage tracking page branding and animation timings."
            actions={<Button size="small">Refresh</Button>} />
          <div style={{marginTop:14}}>
            <Tabs active={tab} onChange={setTab} tabs={[
              {name:'theme',label:'Theme',content:<SectionTitle>Fire report</SectionTitle>},
              {name:'timings',label:'Timings',content:<SectionTitle>Animation Duration</SectionTitle>}
            ]} />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
