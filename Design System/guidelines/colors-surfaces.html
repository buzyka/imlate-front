<meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;height:130px;font-family:var(--il-font-sans);background:#fff;display:flex;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;width:100%}.sw{flex:1;min-width:0;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:78px;font-size:11px;line-height:1.35}.sw b{font-weight:600;font-size:11px}.sw code{font-family:var(--il-font-mono);font-size:9.5px;opacity:.8}</style><div class="row"><div class="sw" style="background:var(--il-surface-page);color:#0f172a;border:1px solid #e4e7ed;"><b>page</b><code>--il-surface-page #f6f8fc</code></div><div class="sw" style="background:var(--il-surface-card);color:#0f172a;border:1px solid #eef2f7;"><b>card</b><code>--il-surface-card #fff</code></div><div class="sw" style="background:var(--il-surface-table-head);color:#475569;border:1px solid #e4e7ed;"><b>table head</b><code>#f8fafc</code></div><div class="sw" style="background:var(--il-surface-row-hover);color:#475569;border:1px solid #e4e7ed;"><b>row hover</b><code>#f1f5f9</code></div><div class="sw" style="background:var(--el-fill-color-light);color:#606266;border:1px solid #e4e7ed;"><b>fill light</b><code>#f5f7fa</code></div><div class="sw" style="background:var(--el-fill-color);color:#606266;border:1px solid #e4e7ed;"><b>fill</b><code>#f0f2f5</code></div></div>
