<meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;height:130px;font-family:var(--il-font-sans);background:#fff;display:flex;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;width:100%}.sw{flex:1;min-width:0;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:78px;font-size:11px;line-height:1.35}.sw b{font-weight:600;font-size:11px}.sw code{font-family:var(--il-font-mono);font-size:9.5px;opacity:.8}</style><div class="row"><div class="sw" style="background:var(--el-text-color-primary);color:#fff;"><b>primary</b><code>#303133</code></div><div class="sw" style="background:var(--el-text-color-regular);color:#fff;"><b>regular</b><code>#606266</code></div><div class="sw" style="background:var(--el-text-color-secondary);color:#fff;"><b>secondary</b><code>#909399</code></div><div class="sw" style="background:var(--el-text-color-placeholder);color:#fff;"><b>placeholder</b><code>#a8abb2</code></div><div class="sw" style="background:var(--el-text-color-disabled);color:#303133;"><b>disabled</b><code>#c0c4cc</code></div><div class="sw" style="background:var(--il-text-slate);color:#fff;"><b>slate</b><code>--il-text-slate #0f172a</code></div><div class="sw" style="background:var(--il-text-mute);color:#fff;"><b>mute</b><code>--il-text-mute #94a3b8</code></div></div>
