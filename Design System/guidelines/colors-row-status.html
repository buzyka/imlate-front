<meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;height:130px;font-family:var(--il-font-sans);background:#fff;display:flex;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;width:100%}.sw{flex:1;min-width:0;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:78px;font-size:11px;line-height:1.35}.sw b{font-weight:600;font-size:11px}.sw code{font-family:var(--il-font-mono);font-size:9.5px;opacity:.8}</style><div class="row"><div class="sw" style="background:var(--il-row-signed-in);color:#0f172a;border:1px solid #d1fae5;"><b>signed in</b><code>--il-row-signed-in #ecfdf5</code></div><div class="sw" style="background:var(--il-row-signed-out);color:#0f172a;border:1px solid #fde68a;"><b>signed out</b><code>--il-row-signed-out #fffbeb</code></div><div class="sw" style="background:var(--il-row-not-signed);color:#0f172a;border:1px solid #e2e8f0;"><b>not signed</b><code>--il-row-not-signed #f8fafc</code></div></div>
