<meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;height:130px;font-family:var(--il-font-sans);background:#fff;display:flex;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;width:100%}.sw{flex:1;min-width:0;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:78px;font-size:11px;line-height:1.35}.sw b{font-weight:600;font-size:11px}.sw code{font-family:var(--il-font-mono);font-size:9.5px;opacity:.8}</style><div class="row"><div class="sw" style="background:var(--el-color-success);color:#fff;"><b>success</b><code>#67c23a</code></div><div class="sw" style="background:var(--el-color-warning);color:#fff;"><b>warning</b><code>#e6a23c</code></div><div class="sw" style="background:var(--el-color-danger);color:#fff;"><b>danger</b><code>#f56c6c</code></div><div class="sw" style="background:var(--el-color-info);color:#fff;"><b>info</b><code>#909399</code></div><div class="sw" style="background:var(--el-color-success-light-9);color:#529b2e;"><b>success-9</b><code>#f0f9eb</code></div><div class="sw" style="background:var(--el-color-warning-light-9);color:#b88230;"><b>warning-9</b><code>#fdf6ec</code></div><div class="sw" style="background:var(--el-color-danger-light-9);color:#c45656;"><b>danger-9</b><code>#fef0f0</code></div><div class="sw" style="background:var(--el-color-info-light-9);color:#73767a;"><b>info-9</b><code>#f4f4f5</code></div></div>
